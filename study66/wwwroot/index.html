<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 纯命令执行 · 无修饰字段</title>
    <!-- 极简风格，只保证功能与清晰度，不加任何隐藏字段或前缀 -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Fira Code', monospace;
        }
        body {
            background: linear-gradient(145deg, #0b0f17 0%, #1a1f2c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
        }
        .card {
            background: rgba(18, 25, 40, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(90, 140, 255, 0.25);
            border-radius: 2.5rem;
            padding: 2.5rem 2.2rem;
            width: 100%;
            max-width: 720px;
            box-shadow: 0 30px 50px -15px #00000080, 0 0 0 1px #2e3a5e inset;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 450;
            letter-spacing: -0.02em;
            margin: 0 0 0.4rem 0;
            color: #eef5ff;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        h1 span {
            background: #2d3b58;
            color: #bdd3ff;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            border: 1px solid #4c6190;
            letter-spacing: 0.2px;
            margin-left: 0.5rem;
        }
        .sub {
            color: #9bb2da;
            font-size: 1rem;
            margin-bottom: 2rem;
            border-left: 3px solid #3f5e9c;
            padding-left: 1.2rem;
            background: rgba(20, 30, 50, 0.5);
            border-radius: 0 8px 8px 0;
            line-height: 1.5;
        }
        .sub strong {
            color: white;
            font-weight: 500;
            background: #26334d;
            padding: 2px 10px;
            border-radius: 24px;
            font-family: monospace;
            font-size: 0.95rem;
            border: 1px solid #4d70b0;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .cmd-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #ccdeff;
            font-weight: 450;
            font-size: 1.1rem;
            margin-bottom: 0.2rem;
        }
        .cmd-label svg {
            opacity: 0.8;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #0f1420;
            border-radius: 60px;
            border: 2px solid #2f3f60;
            transition: 0.18s ease;
            box-shadow: 0 6px 12px #00000040, inset 0 1px 3px #ffffff0d;
        }
        .input-wrapper:focus-within {
            border-color: #6285e0;
            box-shadow: 0 0 0 3px #1e3a8a40, 0 6px 14px black;
        }
        .prompt-sign {
            font-family: 'Fira Code', monospace;
            font-size: 1.5rem;
            font-weight: 500;
            color: #6d94f0;
            margin-left: 1.3rem;
            margin-right: 0.2rem;
            user-select: none;
            text-shadow: 0 0 6px #3f6be0;
        }
        input[type="text"] {
            width: 100%;
            background: transparent;
            border: none;
            padding: 1.1rem 1.1rem 1.1rem 0.4rem;
            font-size: 1.3rem;
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            color: #ffffff;
            caret-color: #6d94f0;
            outline: none;
        }
        input[type="text"]::placeholder {
            color: #3f4e6b;
            font-size: 1.1rem;
            font-family: system-ui, monospace;
            font-weight: 300;
            letter-spacing: 0.3px;
        }
        /* 纯粹确保没有任何隐藏字段或额外前缀 */
        .action-hint {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            background: #121b2b;
            border-radius: 40px;
            padding: 0.8rem 1.5rem;
            border: 1px dashed #3a4b70;
            font-size: 1rem;
        }
        .action-hint code {
            background: #1f2b3f;
            color: #ffcb7a;
            padding: 0.3rem 1.1rem;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 500;
            border: 1px solid #606f99;
            box-shadow: inset 0 1px 4px #0000005e;
        }
        .action-hint .method {
            background: #2e3b4e;
            color: #aac8ff;
            border-radius: 40px;
            padding: 0.2rem 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            border: 1px solid #5773b0;
        }
        .btn-submit {
            background: #2f4eb0;
            border: none;
            padding: 1.2rem 2rem;
            border-radius: 60px;
            font-size: 1.4rem;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            cursor: pointer;
            border: 1px solid #7a9cff;
            box-shadow: 0 10px 20px -8px #020614, 0 4px 0 0 #102154;
            transition: 0.1s ease;
            width: 100%;
            letter-spacing: 0.8px;
        }
        .btn-submit:hover {
            background: #3f62ce;
            transform: translateY(-2px);
            box-shadow: 0 16px 24px -8px #020618, 0 4px 0 0 #14309c;
        }
        .btn-submit:active {
            transform: translateY(4px);
            box-shadow: 0 8px 14px -6px #020614, 0 1px 0 0 #1f3ca0;
        }
        .disclaimer {
            text-align: center;
            color: #6f85aa;
            font-size: 0.9rem;
            border-top: 1px solid #253349;
            padding-top: 1.3rem;
            margin-top: 1rem;
        }
        .disclaimer strong {
            color: #baceff;
            background: #1e283e;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-weight: 500;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            ⌨️ 原始命令提交器
            <span>纯净</span>
        </h1>
        <div class="sub">
            <strong>/exec</strong> · 表单完全按原样发送，不附加任何字段或前缀
        </div>

        <!-- 
            =========  重 点  =========
            表单 action 明确为 "/exec"
            方法 post —— 无 enctype 修改，纯 application/x-www-form-urlencoded
            里面只有用户输入的文本域，没有隐藏输入，没有额外 name 包装。
            浏览器发送的字段名就是 "command" (由 name 属性决定)，值就是用户原始输入。
            绝对没有自动加前缀，没有隐藏字段。
        -->
        <form action="/exec" method="POST">
            <!-- 标签简约，只关联输入域 -->
            <div class="cmd-label">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6d94f0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l4 4 8-12M4 7l4-4 8 12"/></svg>
                输入任何命令 (原始内容)
            </div>

            <div class="input-wrapper">
                <span class="prompt-sign">$</span>
                <!-- 唯一输入字段，name="command" 无任何前缀，值由用户完全控制 -->
                <input type="text" 
                       name="command" 
                       placeholder="例: ls -la / 或 docker ps" 
                       autofocus 
                       spellcheck="false"
                       autocomplete="off">
                <!-- 绝对没有隐藏 input / 没有任何额外参数 -->
            </div>

            <!-- 动作可视化提示：action 与 method 完全匹配需求 -->
            <div class="action-hint">
                <span class="method">POST</span>
                <span style="color:#9ab3dd;">→</span>
                <code>/exec</code>
                <span style="color:#4e6896; margin-left: auto; font-size:0.9rem;">👆 无额外字段</span>
            </div>

            <!-- 提交按钮 -->
            <button type="submit" class="btn-submit">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
                提交到 /exec
            </button>

            <!-- 法律声明 / 纯技术展示，无数据收集 -->
            <div class="disclaimer">
                ⚡ 提交内容即为 <strong>command=用户输入</strong> · 无包装 · 无前缀字段
            </div>
        </form>

        <!-- 额外说明区块 (仅视觉辅助，不是表单部分) -->
        <div style="margin-top: 1.6rem; background: #0c132030; border-radius: 28px; padding: 0.8rem 1.4rem; border: 1px solid #2b3850; color:#b8ceff; font-size:0.95rem; display: flex; gap: 12px; flex-wrap: wrap;">
            <span>🔍 抓包验证：</span>
            <span style="background: #1b2640; padding: 0.2rem 1rem; border-radius: 36px; font-family: monospace;">POST /exec</span>
            <span style="background: #1b2640; padding: 0.2rem 1rem; border-radius: 36px; font-family: monospace;">Payload: command=你的原始命令</span>
            <span style="color:#ffb574;">✔ 无 _token / prefix / hidden 字段</span>
        </div>
    </div>

    <!-- 没有任何额外脚本修改表单行为，纯静态保证 -->
</body>
</html>
